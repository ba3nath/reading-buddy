<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Buddy — Parent</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/parent.css" />
</head>
<body class="parent-page">
  <header class="parent-top">
    <div>
      <p class="eyebrow">Reading Buddy</p>
      <h1>Parent page</h1>
      <p class="lede">Trends and settings — no PIN. Nothing here subtracts stars or garden growth.</p>
    </div>
    <a class="btn ghost" href="/">Back to child game</a>
  </header>

  <main class="parent-grid">
    <section class="panel" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <form class="settings-form" data-settings>
        <label>
          Profile name <span class="optional">(optional)</span>
          <input name="profile_name" type="text" autocomplete="nickname" placeholder="Leave blank — progress still saves" />
        </label>
        <label>
          Mode
          <select name="mode">
            <option value="beginner">Beginner</option>
            <option value="strict">Strict</option>
          </select>
        </label>
        <label>
          Difficulty
          <select name="level">
            <option value="1">Words</option>
            <option value="2">Phrases</option>
            <option value="3">Rhymes</option>
            <option value="4">Stories</option>
          </select>
        </label>
        <label>
          Set (stage)
          <select name="stage">
            <option value="1">Set 1 of 8</option>
            <option value="2">Set 2 of 8</option>
            <option value="3">Set 3 of 8</option>
            <option value="4">Set 4 of 8</option>
            <option value="5">Set 5 of 8</option>
            <option value="6">Set 6 of 8</option>
            <option value="7">Set 7 of 8</option>
            <option value="8">Set 8 of 8</option>
          </select>
        </label>
        <label>
          Session length
          <select name="session_length">
            <option value="5">5 words / phrases</option>
            <option value="10">10 words / phrases</option>
          </select>
        </label>
        <label class="buddy-setting">
          Buddy
          <span class="buddy-setting-row">
            <img class="buddy-thumb" data-buddy-thumb src="/static/mascots/krishna.svg" alt="" width="48" height="48" />
            <select name="buddy">
              <option value="krishna">Krishna</option>
              <option value="unicorn">Unicorn</option>
            </select>
          </span>
        </label>
        <label class="check">
          <input name="keep_audio" type="checkbox" />
          Keep audio after scoring (playable below; turning off deletes kept files)
        </label>
        <label class="check">
          <input name="auto_strict" type="checkbox" />
          Auto-strict after move-up streak
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Save settings</button>
          <button type="button" class="btn ghost" data-export>Download CSV zip</button>
        </div>
        <p class="form-status" data-settings-status aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="accuracy-title">
      <h2 id="accuracy-title">Accuracy by day</h2>
      <div class="bars" data-accuracy></div>
    </section>

    <section class="panel" aria-labelledby="mastered-title">
      <h2 id="mastered-title">Mastered</h2>
      <h3>This week</h3>
      <ul data-mastered-week></ul>
      <h3>All time</h3>
      <ul data-mastered-all></ul>
    </section>

    <section class="panel" aria-labelledby="tricky-title">
      <h2 id="tricky-title">Tricky words</h2>
      <ul data-tricky></ul>
    </section>

    <section class="panel" aria-labelledby="sounds-title">
      <h2 id="sounds-title">Sound heatmap</h2>
      <p class="note" data-sounds-note></p>
      <div class="heat" data-sounds></div>
    </section>

    <section class="panel" aria-labelledby="kept-title" data-kept-panel hidden>
      <h2 id="kept-title">Kept audio</h2>
      <ul class="kept-list" data-kept></ul>
    </section>
  </main>

  <script type="module" src="/static/js/parent.js"></script>
</body>
</html>
