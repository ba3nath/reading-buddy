<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Colorful unicorn horse buddy">
  <style>
    .horn, .mane, .eye, .ear, .tail, .body { transform-box: fill-box; transform-origin: center; }
    .idle .mane { animation: sway 2.8s ease-in-out infinite; }
    .idle .tail { animation: sway 2.4s ease-in-out infinite reverse; }
    .idle .eye { animation: blink 4s step-end infinite; }
    .listening .ear { animation: perk 0.7s ease-in-out infinite; }
    .listening .horn { animation: glow 0.8s ease-in-out infinite; }
    .cheer .body { animation: hop 0.55s ease; }
    .cheer .mane { animation: sway 0.35s ease-in-out infinite; }
    .encourage .body { animation: nod 1s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(8deg)} }
    @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 92%{transform:scaleY(0.12)} }
    @keyframes perk { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-10deg)} }
    @keyframes glow { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes hop { 0%{transform:translateY(0)} 40%{transform:translateY(-10px)} 100%{transform:translateY(0)} }
    @keyframes nod { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
  </style>
  <g class="buddy-root idle">
    <g class="tail">
      <path d="M90 76 Q112 68 110 48" fill="none" stroke="#ff8f6b" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M92 80 Q114 90 102 102" fill="none" stroke="#ffd56a" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M88 74 Q108 58 116 66" fill="none" stroke="#7ec8e8" stroke-width="5" stroke-linecap="round"/>
      <path d="M91 82 Q106 98 94 106" fill="none" stroke="#7bc47f" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g class="body">
      <!-- horse torso -->
      <ellipse cx="62" cy="84" rx="32" ry="24" fill="#ff9ec0"/>
      <!-- neck -->
      <ellipse cx="70" cy="62" rx="14" ry="20" fill="#ff9ec0"/>
      <!-- head + long muzzle (horse) -->
      <ellipse cx="52" cy="44" rx="24" ry="20" fill="#ffb0c8"/>
      <ellipse class="muzzle" cx="28" cy="50" rx="16" ry="11" fill="#ffd0e0"/>
      <!-- ears -->
      <polygon class="ear" points="44,28 40,8 54,26" fill="#ff9ec0"/>
      <polygon class="ear" points="66,26 70,6 78,28" fill="#ff9ec0"/>
      <polygon points="45,24 43,12 52,24" fill="#ff8f6b"/>
      <polygon points="68,22 70,10 76,24" fill="#ff8f6b"/>
      <!-- horn seated on forehead -->
      <polygon class="horn" points="56,26 51,4 61,4" fill="#ffd56a"/>
      <path d="M53 20 Q56 16 59 20 M54 13 Q56 10 58 13" stroke="#e09b45" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- rainbow mane along neck -->
      <g class="mane">
        <path d="M74 30 Q86 14 94 30 Q84 38 74 30" fill="#ff8f6b"/>
        <path d="M76 38 Q92 24 98 42 Q86 48 76 38" fill="#ffd56a"/>
        <path d="M78 48 Q96 40 100 56 Q86 58 78 48" fill="#7ec8e8"/>
        <path d="M78 58 Q96 56 98 72 Q84 70 78 58" fill="#7bc47f"/>
        <path d="M72 26 Q78 8 88 18 Q80 32 72 26" fill="#ffb020"/>
      </g>
      <!-- face -->
      <circle class="eye" cx="46" cy="40" r="3.8" fill="#2c241c"/>
      <circle class="eye" cx="62" cy="38" r="3.8" fill="#2c241c"/>
      <circle cx="47.3" cy="38.7" r="1.15" fill="#fff" opacity="0.9"/>
      <circle cx="63.3" cy="36.7" r="1.15" fill="#fff" opacity="0.9"/>
      <ellipse cx="22" cy="48" rx="4" ry="3" fill="#ff8f6b" opacity="0.5"/>
      <ellipse cx="30" cy="52" rx="4" ry="2.8" fill="#e0898a"/>
      <path d="M20 54 Q28 59 36 54" stroke="#2c241c" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <!-- colorful belly -->
      <ellipse cx="58" cy="90" rx="18" ry="11" fill="#ffe7b8"/>
      <!-- legs -->
      <rect x="42" y="98" width="8" height="14" rx="3.5" fill="#ff8fb0"/>
      <rect x="56" y="99" width="8" height="13" rx="3.5" fill="#ff8fb0"/>
      <rect x="70" y="98" width="8" height="14" rx="3.5" fill="#ff8fb0"/>
    </g>
  </g>
</svg>
