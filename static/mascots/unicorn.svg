<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Friendly unicorn buddy">
  <style>
    /* Original unicorn: cream coat, soft lavender mane, gold horn  kid-friendly. */
    .horn, .mane, .eye, .ear, .tail { transform-box: fill-box; transform-origin: center; }
    .idle .mane { animation: sway 2.8s ease-in-out infinite; }
    .idle .tail { animation: sway 2.4s ease-in-out infinite reverse; }
    .idle .eye { animation: blink 4s step-end infinite; }
    .listening .ear { animation: perk 0.7s ease-in-out infinite; }
    .listening .horn { animation: glow 0.8s ease-in-out infinite; }
    .cheer .body { animation: hop 0.55s ease; }
    .cheer .mane { animation: sway 0.35s ease-in-out infinite; }
    .encourage .body { animation: nod 1s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(8deg)} }
    @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 92%{transform:scaleY(0.12)} }
    @keyframes perk { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-10deg)} }
    @keyframes glow { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes hop { 0%{transform:translateY(0)} 40%{transform:translateY(-10px)} 100%{transform:translateY(0)} }
    @keyframes nod { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
  </style>
  <g class="buddy-root idle">
    <path class="tail" d="M88 82 Q108 70 102 48" fill="none" stroke="#c4b0d8" stroke-width="7" stroke-linecap="round"/>
    <path d="M96 58 Q104 52 100 44" fill="none" stroke="#e8c4d4" stroke-width="4" stroke-linecap="round"/>
    <g class="body">
      <ellipse cx="56" cy="80" rx="32" ry="24" fill="#f7efe6"/>
      <circle cx="56" cy="48" r="27" fill="#f7efe6"/>
      <!-- ears -->
      <ellipse class="ear" cx="34" cy="26" rx="7" ry="11" fill="#f7efe6" transform="rotate(-18 34 26)"/>
      <ellipse class="ear" cx="78" cy="26" rx="7" ry="11" fill="#f7efe6" transform="rotate(18 78 26)"/>
      <ellipse cx="34" cy="27" rx="3.5" ry="6" fill="#f0c8d4" transform="rotate(-18 34 27)"/>
      <ellipse cx="78" cy="27" rx="3.5" ry="6" fill="#f0c8d4" transform="rotate(18 78 27)"/>
      <!-- horn -->
      <polygon class="horn" points="56,22 50,4 62,4" fill="#e8c878"/>
      <line x1="53" y1="16" x2="59" y2="16" stroke="#d4a84a" stroke-width="1.2" opacity="0.7"/>
      <line x1="54" y1="10" x2="58" y2="10" stroke="#d4a84a" stroke-width="1.2" opacity="0.7"/>
      <!-- mane -->
      <g class="mane">
        <path d="M42 30 Q36 18 48 22 Q44 34 42 30" fill="#c4b0d8"/>
        <path d="M50 28 Q48 12 58 16 Q54 30 50 28" fill="#e8c4d4"/>
        <path d="M60 28 Q62 12 70 18 Q66 32 60 28" fill="#b8d4e8"/>
        <path d="M68 32 Q78 22 76 36 Q70 36 68 32" fill="#c4b0d8"/>
      </g>
      <!-- face -->
      <circle class="eye" cx="46" cy="48" r="3.8" fill="#3a2a28"/>
      <circle class="eye" cx="66" cy="48" r="3.8" fill="#3a2a28"/>
      <circle cx="47.4" cy="46.8" r="1.2" fill="#fff" opacity="0.9"/>
      <circle cx="67.4" cy="46.8" r="1.2" fill="#fff" opacity="0.9"/>
      <circle cx="40" cy="56" r="5" fill="#f0c8d4" opacity="0.55"/>
      <circle cx="72" cy="56" r="5" fill="#f0c8d4" opacity="0.55"/>
      <ellipse cx="56" cy="56" rx="4.5" ry="3.2" fill="#e8a0a8"/>
      <path d="M50 64 Q56 69 62 64" stroke="#3a2a28" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
