<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Friendly mouse buddy">
  <style>
    /* Original mouse: soft gray, pink ears/nose, long curved tail — original character. */
    .ear, .tail, .eye, .body { transform-box: fill-box; transform-origin: center; }
    .idle .tail { animation: curl 2.6s ease-in-out infinite; }
    .idle .eye { animation: blink 3.8s step-end infinite; }
    .listening .ear { animation: perk 0.65s ease-in-out infinite; }
    .listening .whisker { animation: twitch 0.45s ease-in-out infinite; }
    .cheer .body { animation: hop 0.55s ease; }
    .cheer .tail { animation: curl 0.35s ease-in-out infinite; }
    .encourage .body { animation: nod 1s ease-in-out infinite; }
    @keyframes curl { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(12deg)} }
    @keyframes blink { 0%,88%,100%{transform:scaleY(1)} 90%{transform:scaleY(0.12)} }
    @keyframes perk { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes twitch { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-5deg)} }
    @keyframes hop { 0%{transform:translateY(0)} 40%{transform:translateY(-9px)} 100%{transform:translateY(0)} }
    @keyframes nod { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
  </style>
  <g class="buddy-root idle">
    <path class="tail" d="M86 78 Q108 70 104 52 Q100 40 112 36" fill="none" stroke="#9a8b7a" stroke-width="5" stroke-linecap="round"/>
    <g class="body">
      <ellipse cx="56" cy="78" rx="30" ry="24" fill="#cfc4b8"/>
      <circle cx="56" cy="48" r="26" fill="#cfc4b8"/>
      <circle class="ear" cx="30" cy="28" r="14" fill="#cfc4b8"/>
      <circle class="ear" cx="82" cy="28" r="14" fill="#cfc4b8"/>
      <circle cx="30" cy="28" r="8" fill="#f0b8b0"/>
      <circle cx="82" cy="28" r="8" fill="#f0b8b0"/>
      <circle class="eye" cx="46" cy="48" r="3.5" fill="#2c241c"/>
      <circle class="eye" cx="66" cy="48" r="3.5" fill="#2c241c"/>
      <circle cx="42" cy="54" r="4.5" fill="#f0b8b0" opacity="0.5"/>
      <circle cx="70" cy="54" r="4.5" fill="#f0b8b0" opacity="0.5"/>
      <ellipse cx="56" cy="56" rx="4" ry="3" fill="#e0898a"/>
      <circle cx="47.2" cy="46.8" r="1.1" fill="#fff" opacity="0.9"/>
      <circle cx="67.2" cy="46.8" r="1.1" fill="#fff" opacity="0.9"/>
      <path d="M50 62 Q56 66 62 62" stroke="#2c241c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <line class="whisker" x1="24" y1="52" x2="40" y2="54" stroke="#6a5a4a" stroke-width="1.3"/>
      <line class="whisker" x1="24" y1="58" x2="40" y2="57" stroke="#6a5a4a" stroke-width="1.3"/>
      <line class="whisker" x1="72" y1="54" x2="88" y2="52" stroke="#6a5a4a" stroke-width="1.3"/>
      <line class="whisker" x1="72" y1="57" x2="88" y2="58" stroke="#6a5a4a" stroke-width="1.3"/>
    </g>
  </g>
</svg>
