<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" role="img" aria-label="Reading garden">
  <style>
    .stage { display: none; }
    svg[data-stage="seed"] .stage-seed,
    svg[data-stage="sprout"] .stage-sprout,
    svg[data-stage="flower"] .stage-flower,
    svg[data-stage="creature"] .stage-creature,
    svg[data-stage="sticker"] .stage-sticker { display: block; }
    .grow { animation: rise 0.8s ease; transform-origin: 80px 90px; }
    @keyframes rise { from { transform: scale(0.6); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  </style>
  <ellipse cx="80" cy="88" rx="70" ry="10" fill="#b7d4a8"/>
  <g class="stage stage-seed grow">
    <ellipse cx="80" cy="78" rx="8" ry="5" fill="#8b5a2b"/>
  </g>
  <g class="stage stage-sprout grow">
    <rect x="78" y="55" width="4" height="28" rx="2" fill="#3f8f5a"/>
    <ellipse cx="70" cy="58" rx="10" ry="6" fill="#5fbf7a" transform="rotate(-30 70 58)"/>
    <ellipse cx="90" cy="60" rx="10" ry="6" fill="#5fbf7a" transform="rotate(28 90 60)"/>
  </g>
  <g class="stage stage-flower grow">
    <rect x="78" y="48" width="4" height="36" rx="2" fill="#3f8f5a"/>
    <circle cx="80" cy="42" r="8" fill="#f0c94a"/>
    <circle cx="68" cy="48" r="7" fill="#e89bb5"/>
    <circle cx="92" cy="48" r="7" fill="#e89bb5"/>
    <circle cx="74" cy="34" r="7" fill="#e89bb5"/>
    <circle cx="86" cy="34" r="7" fill="#e89bb5"/>
  </g>
  <g class="stage stage-creature grow">
    <rect x="78" y="50" width="4" height="34" rx="2" fill="#3f8f5a"/>
    <circle cx="80" cy="42" r="7" fill="#f0c94a"/>
    <ellipse cx="52" cy="70" rx="14" ry="10" fill="#7ec8e3"/>
    <circle cx="46" cy="66" r="2" fill="#2c241c"/>
    <circle cx="54" cy="66" r="2" fill="#2c241c"/>
    <path d="M40 72 Q38 78 44 76" stroke="#2c241c" fill="none" stroke-width="1.5"/>
  </g>
  <g class="stage stage-sticker grow">
    <rect x="78" y="50" width="4" height="34" rx="2" fill="#3f8f5a"/>
    <circle cx="80" cy="42" r="7" fill="#f0c94a"/>
    <ellipse cx="52" cy="70" rx="14" ry="10" fill="#7ec8e3"/>
    <g transform="translate(98 40)">
      <polygon points="0,-16 5,-5 16,-5 7,2 10,14 0,7 -10,14 -7,2 -16,-5 -5,-5" fill="#f4c27a" stroke="#e09b45" stroke-width="1"/>
    </g>
  </g>
</svg>
